<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Transcriptor</title>
  <meta name="description" content="Graba y transcribe audio al instante, 100% en tu navegador. Sin cuentas, sin servidores, sin configuración." />

  <meta name="theme-color" content="#0d0d14" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="screen">
    <!-- Estado idle / grabando -->
    <section class="stage" id="stage-record">
      <div class="timer" id="timer" aria-live="polite">00:00</div>

      <button id="recordBtn" class="record-btn" type="button" aria-label="Toca para grabar">
        <span class="pulse-ring"></span>
        <span class="pulse-ring pulse-ring--delay"></span>
        <svg class="icon icon-mic" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v6a3.5 3.5 0 0 0 3.5 3.5Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M6 11v1a6 6 0 0 0 12 0v-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon icon-stop" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
        </svg>
      </button>

      <p class="hint" id="hint">Toca para grabar</p>
    </section>

    <!-- Estado transcribiendo -->
    <section class="stage stage--hidden" id="stage-processing">
      <div class="spinner" aria-hidden="true"></div>
      <p class="processing-title" id="processingTitle">Transcribiendo…</p>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="processing-detail" id="processingDetail">Preparando el modelo…</p>
      <p class="processing-notice" id="processingNotice"></p>
    </section>

    <!-- Estado resultado -->
    <section class="stage stage--hidden" id="stage-result">
      <div class="result-box">
        <textarea id="resultText" class="result-text" readonly spellcheck="false"></textarea>
      </div>
      <div class="result-actions">
        <button id="copyBtn" class="action-btn" type="button">Copiar</button>
        <button id="downloadBtn" class="action-btn" type="button">Descargar .txt</button>
      </div>
      <button id="newRecordingBtn" class="new-recording-btn" type="button">Nueva grabación</button>
    </section>

    <!-- Error de permiso de micrófono -->
    <section class="stage stage--hidden" id="stage-error">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="1" fill="currentColor"/>
      </svg>
      <p class="error-title" id="errorTitle">No pudimos acceder al micrófono</p>
      <p class="error-detail" id="errorDetail">Revisa los permisos de micrófono para este sitio en tu navegador y vuelve a intentarlo.</p>
      <button id="retryBtn" class="new-recording-btn" type="button">Reintentar</button>
    </section>

    <p class="privacy-note">Todo ocurre en tu dispositivo. Ningún audio sale de tu navegador.</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
